name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check that src/generated matches the Wirespec output
        run: |
          ./generate.sh
          if [ -n "$(git status --porcelain src/generated)" ]; then
            git status --porcelain src/generated
            echo "::error::src/generated is out of date: run ./generate.sh and commit the result"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
